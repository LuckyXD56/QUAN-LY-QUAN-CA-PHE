version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: admin
        uid: 1000
    image: coffeepos-app
    container_name: coffeepos-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - coffeepos-network
    depends_on:
      - db
      
  web:
    image: nginx:alpine
    container_name: coffeepos-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - coffeepos-network

  db:
    image: mysql:8.0
    container_name: coffeepos-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - coffeepos-network
      
  reverb:
    image: coffeepos-app
    container_name: coffeepos-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
    networks:
      - coffeepos-network

networks:
  coffeepos-network:
    driver: bridge

volumes:
  dbdata:
